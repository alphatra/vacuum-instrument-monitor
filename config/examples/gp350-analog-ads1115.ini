[General]
debug = false
log_level = info

[Collector]
interval_seconds = 1.0

[Device]
device_name = GP350_1
channel = IG1

[ADS1115]
# Raspberry Pi exposes its primary I2C bus as /dev/i2c-1.
i2c_bus = 1
i2c_address = 0x48
channel = 0
# PGA 1 selects the +/-4.096 V range. The A0 voltage must still stay below VDD.
pga_gain = 1
data_rate = 128
# Odd count: median rejects one-off I2C/analog spikes.
samples_per_reading = 5

[Calibration]
# GP350 signal -> 68k -> A0 -> 22k -> GP350 GND.
divider_top_ohms = 68000
divider_bottom_ohms = 22000
# Use only after comparing the ADS-derived voltage with a multimeter.
signal_voltage_offset = 0.0

[GP350]
# Must match the emission range configured in the GP350.
emission_current_ma = 1
# GP350 returns slightly above 10 V when the ion gauge is off.
fault_voltage_threshold = 10.05

[File]
csv_filepath = data/gp350_analog_readings.csv
csv_mode = append
log_file = logs/gp350_analog_collector.log

[InfluxDB]
enabled = false
url = http://localhost:8086
org =
bucket =
token =
token_env = INFLUXDB_TOKEN
measurement = vacuum_pressure
timeout = 2.0
retries = 1
fail_on_error = false
