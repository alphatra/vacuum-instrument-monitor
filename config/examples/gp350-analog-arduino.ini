[General]
debug = false
log_level = info

[Connection]
# The sketch answers over the Arduino USB CDC port (/dev/ttyACM*).
module_type = arduino
serial_port = auto
baudrate = 9600
bytesize = 8
parity = none
stopbits = 1
line_terminator = lf
# Uno resets when the port opens and averages 64 samples per reading.
timeout = 3.0
write_timeout = 1.0

[Detection]
device_index = 0
probe_timeout = 3.0
scan_rs485 = false

[Collector]
command = READ
interval_seconds = 1.0

[Device]
device_type = arduino_adc
device_name = GP350_1
channel = IG1
pressure_unit = Torr

[Calibration]
# GP350 signal -> 67k -> Arduino A0 -> 21.55k -> GP350 GND.
# Measured values for this unit, not nominal (68k/22k).
divider_top_ohms = 67000
divider_bottom_ohms = 21550
# Use only after comparing the reported voltage with a multimeter.
signal_voltage_offset = 0.0

[GP350]
# Must match the emission range set on the GP350.
emission_current_ma = 1
# GP350 returns slightly above 10 V when the ion gauge is off.
fault_voltage_threshold = 10.05

[File]
csv_filepath = data/gp350_arduino_readings.csv
csv_mode = append
log_file = logs/gp350_arduino_collector.log

[InfluxDB]
enabled = false
url = http://localhost:8086
org =
bucket =
token =
token_env = INFLUXDB_TOKEN
measurement = vacuum_pressure
timeout = 2.0
retries = 1
fail_on_error = false
