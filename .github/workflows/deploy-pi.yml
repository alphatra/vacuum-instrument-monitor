name: Deploy Raspberry Pi

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-meterdevicepi
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - meterdevicepi
    steps:
      - name: Deploy on Raspberry Pi
        # Deploy the exact commit CI verified (workflow_run.head_sha); a manual
        # dispatch deploys github.sha, the commit the run was started on.
        run: >-
          sudo TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          /usr/local/sbin/vacuum-monitor-deploy
